apiVersion: v1
kind: Namespace
metadata:
  name: practica
---
apiVersion: v1
kind: Service
metadata:
  name: mdb
  namespace: practica
spec:
  clusterIP: None
  selector:
    app: mdb
  ports:
    - port: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mdb
  namespace: practica
spec:
  serviceName: mdb
  selector:
    matchLabels:
      app: mdb
  template:
    metadata:
      labels:
        app: mdb
    spec:
      containers:
        - name: mongodb
          image: jeviermedinag/biblioteca-mongo:1.0
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          startupProbe:
            exec:
              command: [mongosh, --quiet, --eval, "db.adminCommand('ping').ok"]
            timeoutSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [mongosh, --quiet, --eval, "db.adminCommand('ping').ok"]
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: [mongosh, --quiet, --eval, "db.adminCommand('ping').ok"]
            timeoutSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: biblioteca-web
  namespace: practica
spec:
  selector:
    matchLabels:
      app: biblioteca-web
  template:
    metadata:
      labels:
        app: biblioteca-web
    spec:
      initContainers:
        - name: wait-for-mongodb
          image: jeviermedinag/biblioteca-web:1.3
          command: [python, -c]
          args:
            - |
              import socket
              import time

              for attempt in range(60):
                  try:
                      with socket.create_connection(("mdb", 27017), timeout=2):
                          break
                  except OSError:
                      if attempt == 59:
                          raise
                      time.sleep(2)
      containers:
        - name: web
          image: jeviermedinag/biblioteca-web:1.3
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          livenessProbe:
            httpGet:
              path: /
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: biblioteca-web
  namespace: practica
spec:
  selector:
    app: biblioteca-web
  ports:
    - port: 8080
